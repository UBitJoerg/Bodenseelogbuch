<!DOCTYPE html>
<html>
<head>
  <title>Bodensee-Polygon (OpenSeaMap + OSM)</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #map { height: 600px; width: 100%; }
    body { margin: 0; padding: 0; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([47.6, 9.2], 8);

    // OpenStreetMap als Basiskarte (Hintergrund)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    // OpenSeaMap als Overlay (maritime Objekte: Häfen, Bojen, etc.)
    L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png', {
      attribution: 'Seamarks: &copy; <a href="https://www.openseamap.org">OpenSeaMap</a>'
    }).addTo(map);

    // Polygon
    const polygon = L.polygon([
      [47.627, 8.8278],
      [47.646, 9.162],
      [47.474, 9.482],
      [47.417, 9.7458],
      [47.562, 9.8175],
      [47.850, 9.0167],
      [47.627, 8.8278]
    ], {
      color: 'red',
      weight: 3,
      opacity: 0.7,
      fillOpacity: 0.2
    }).addTo(map);

    map.fitBounds(polygon.getBounds());
  </script>
</body>
</html>
