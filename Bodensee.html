<!DOCTYPE html>
<html>
<head>
  <title>Bodensee-Polygon (GPS Simulation mit Maus + Ray-Casting)</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #map { height: 600px; width: 100%; }
    body { margin: 0; padding: 0; }
    #info {
      position: absolute;
      top: 10px;
      right: 10px;
      background: white;
      padding: 10px;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      font-family: Arial, sans-serif;
      z-index: 1000;
    }
    #status {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: white;
      padding: 10px;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      font-family: Arial, sans-serif;
      z-index: 1000;
    }
    .inside { background: #d4edda; }
    .outside { background: #f8d7da; }
    .tracking { background: #fff3cd; }
    .anker { background: #e2e3e5; color: #383d41; }
    #debug {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(255,255,255,0.8);
      padding: 8px;
      border-radius: 5px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      z-index: 1000;
      max-width: 300px;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="info">
    <strong>GPS Simulation</strong><br>
    Lat: <span id="lat">-</span><br>
    Lng: <span id="lng">-</span><br>
    <small>Bewege die Maus über die Karte</small>
  </div>
  <div id="status">
    <strong>Status:</strong> <span id="status-text">Warte auf Position...</span>
  </div>
  <div id="debug">
    <strong>Debug:</strong><br>
    Polygon-Check: <span id="polygon-check">-</span><br>
    Schnittpunkte: <span id="intersections">-</span>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Karte initialisieren
    const map = L.map('map').setView([47.6, 9.2], 8);

    // OpenStreetMap als Basiskarte
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    // OpenSeaMap als Overlay
    L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png', {
      attribution: 'Seamarks: &copy; <a href="https://www.openseamap.org">OpenSeaMap</a>'
    }).addTo(map);

    // Polygon-Punkte (deine 6 Eckpunkte)
    const polyPoints = [
      [47.627, 8.8278],   // Neuhausen TG (CH)
      [47.646, 9.162],    // Kreuzlingen TG (CH)
      [47.474, 9.482],    // Rorschach SG (CH)
      [47.417, 9.7458],   // Dornbirn (AT)
      [47.562, 9.8175],   // Möggers (AT)
      [47.850, 9.0167]    // Stockach (DE)
    ];

    // Polygon zeichnen
    const polygon = L.polygon([...polyPoints, polyPoints[0]], {
      color: 'red',
      weight: 3,
      opacity: 0.7,
      fillOpacity: 0.2
    }).addTo(map);

    // Track-Linie für die Simulation
    let trackLine = L.polyline([], { color: 'blue', weight: 4, opacity: 0.8 }).addTo(map);
    let trackPoints = [];
    let boatMarker = null;
    let lastPosition = null;
    let lastTime = 0;
    let isTracking = false;
    let isAnker = false;

    // Boot-Marker (Segelboot-Icon)
    const boatIcon = L.icon({
      iconUrl: 'https://cdn-icons-png.flaticon.com/512/4096/4096634.png',
      iconSize: [32, 32],
      iconAnchor: [16, 16]
    });

    // ============================================
    // RAY-CASTING ALGORITHMUS (präzise Polygon-Erkennung)
    // ============================================
    // Prüft, ob ein Punkt (lat, lng) IM Polygon liegt
    // Methode: Zähle Schnittpunkte einer horizontalen Linie nach Norden
    // Ungerade Anzahl = drinnen, gerade = draußen
    function isInsidePolygon(lat, lng) {
      let intersections = 0;
      
      for (let i = 0, j = polyPoints.length - 1; i < polyPoints.length; j = i++) {
        const xi = polyPoints[i][1], yi = polyPoints[i][0];  // lng, lat
        const xj = polyPoints[j][1], yj = polyPoints[j][0];  // lng, lat

        // Prüfe, ob die horizontale Linie bei y=lat die Kante (i,j) schneidet
        // 1. Kante muss die horizontale Linie überqueren (eine Ecke über, eine unter)
        const crossesHorizontal = (yi > lat) !== (yj > lat);
        
        // 2. Berechne x-Koordinate des Schnittpunkts
        //    Formel: x = xi + (lat - yi) * (xj - xi) / (yj - yi)
        const xIntersect = xi + (lat - yi) * (xj - xi) / (yj - yi);
        
        // 3. Schnittpunkt muss rechts vom Testpunkt liegen (lng < xIntersect)
        if (crossesHorizontal && lng < xIntersect) {
          intersections++;
        }
      }
      
      // Ungerade Anzahl Schnittpunkte = Punkt ist drinnen
      return intersections % 2 === 1;
    }

    // ============================================
    // HILFSFUNKTIONEN
    // ============================================
    function getDistance(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng / 2) * Math.sin(dLng / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function isMoving(currentLat, currentLng) {
      if (!lastPosition) return false;
      const distance = getDistance(
        lastPosition.lat, lastPosition.lng,
        currentLat, currentLng
      );
      const currentTime = Date.now();
      const timeDiff = currentTime - lastTime;
      const speed = distance / (timeDiff / 1000);
      return speed > 0.1;
    }

    function updateStatus(lat, lng) {
      const inside = isInsidePolygon(lat, lng);
      const moving = isMoving(lat, lng);
      
      // Debug: Anzahl Schnittpunkte anzeigen
      let intersections = 0;
      for (let i = 0, j = polyPoints.length - 1; i < polyPoints.length; j = i++) {
        const xi = polyPoints[i][1], yi = polyPoints[i][0];
        const xj = polyPoints[j][1], yj = polyPoints[j][0];
        const crossesHorizontal = (yi > lat) !== (yj > lat);
        const xIntersect = xi + (lat - yi) * (xj - xi) / (yj - yi);
        if (crossesHorizontal && lng < xIntersect) intersections++;
      }
      document.getElementById('intersections').textContent = intersections;
      document.getElementById('polygon-check').textContent = inside ? 'DRINNEN' : 'DRAUSSEN';
      
      let statusText = '';
      let statusClass = '';
      
      if (!inside) {
        statusText = '⚠️ AUSSERHALB Bodensee-Polygon (kein Track möglich)';
        statusClass = 'outside';
        isTracking = false;
        isAnker = false;
      } else {
        if (!isTracking) {
          statusText = '🟢 IM Polygon - Track bereit';
          statusClass = 'inside';
        } else if (moving) {
          statusText = '🚤 TRACK AKTIV - In Bewegung';
          statusClass = 'tracking';
        } else {
          statusText = '⚓ Vor Anker (Stillstand)';
          statusClass = 'anker';
        }
      }
      
      document.getElementById('status').className = statusClass;
      document.getElementById('status-text').textContent = statusText;
    }

    // Mausbewegungs-Handler
    map.on('mousemove', function(e) {
      const lat = e.latlng.lat;
      const lng = e.latlng.lng;
      
      document.getElementById('lat').textContent = lat.toFixed(6);
      document.getElementById('lng').textContent = lng.toFixed(6);
      
      if (!boatMarker) {
        boatMarker = L.marker([lat, lng], { icon: boatIcon, zIndexOffset: 1000 }).addTo(map);
      } else {
        boatMarker.setLatLng([lat, lng]);
      }
      
      const currentTime = Date.now();
      if (currentTime - lastTime > 500 || !lastTime) {
        trackPoints.push([lat, lng]);
        trackLine.setLatLngs(trackPoints);
        lastPosition = { lat, lng };
        lastTime = currentTime;
        
        updateStatus(lat, lng);
        
        if (isInsidePolygon(lat, lng)) {
          if (!isTracking) isTracking = true;
        } else {
          isTracking = false;
          trackPoints = [];
          trackLine.setLatLngs([]);
        }
      }
    });

    // Karte auf Polygon zoomen
    map.fitBounds(polygon.getBounds());

    // Track zurücksetzen bei Klick
    map.on('click', function(e) {
      trackPoints = [];
      trackLine.setLatLngs([]);
      isTracking = false;
      isAnker = false;
      updateStatus(e.latlng.lat, e.latlng.lng);
    });
  </script>
</body>
</html>
