  <title>Bodensee-Polygon (GPS Simulation mit Häfen)</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #map { height: 600px; width: 100%; }
    body { margin: 0; padding: 0; }
    #info {
      position: absolute;
      top: 10px;
      right: 10px;
      background: white;
      padding: 10px;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      font-family: Arial, sans-serif;
      z-index: 1000;
    }
    #status {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: white;
      padding: 10px;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      font-family: Arial, sans-serif;
      z-index: 1000;
      min-width: 300px;
    }
    .inside { background: #d4edda; }
    .outside { background: #f8d7da; }
    .tracking { background: #fff3cd; }
    .harbor { background: #d1ecf1; color: #0c5460; }
    #debug {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(255,255,255,0.8);
      padding: 8px;
      border-radius: 5px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      z-index: 1000;
      max-width: 300px;
    }
    .harbor-marker {
      cursor: pointer;
    }
    .harbor-marker:hover {
      z-index: 2000 !important;
    }
  </style>
</head>

      {"name": "Gottmadingen, Steganlage", "ort": "Gottmadingen", "land": "Deutschland", "lat": 47.8, "lng": 8.8083},
      {"name": "Radolfzell, Hafen", "ort": "Radolfzell", "land": "Deutschland", "lat": 47.75, "lng": 8.9667},
      {"name": "Radolfzell, Segelclubhafen", "ort": "Radolfzell", "land": "Deutschland", "lat": 47.75, "lng": 8.9583},
      {"name": "Möggingen, Steganlage", "ort": "Radolfzell-Möggingen", "land": "Deutschland", "lat": 47.75, "lng": 8.95},
      {"name": "Markelsheim, Steganlage", "ort": "Markelsheim", "land": "Deutschland", "lat": 47.75, "lng": 8.9417},
      {"name": "Bohlingen, Steganlage", "ort": "Singen-Bohlingen", "land": "Deutschland", "lat": 47.75, "lng": 8.9333},
      {"name": "Stahringen, Steganlage", "ort": "Singen-Stahringen", "land": "Deutschland", "lat": 47.75, "lng": 8.925},
      {"name": "Stockach, Hafen", "ort": "Stockach", "land": "Deutschland", "lat": 47.85, "lng": 9.0167}
    ];

    // Karte initialisieren
    const map = L.map('map').setView([47.6, 9.2], 8);

    // OpenStreetMap als Basiskarte
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    // OpenSeaMap als Overlay
    L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png', {
      attribution: 'Seamarks: &copy; <a href="https://www.openseamap.org">OpenSeaMap</a>'
    }).addTo(map);

    // Polygon-Punkte (deine 6 Eckpunkte)
    const polyPoints = [
      [47.627, 8.8278],   // Neuhausen TG (CH)
      [47.646, 9.162],    // Kreuzlingen TG (CH)
      [47.474, 9.482],    // Rorschach SG (CH)
      [47.417, 9.7458],   // Dornbirn (AT)
      [47.562, 9.8175],   // Möggers (AT)
      [47.850, 9.0167]    // Stockach (DE)
    ];

    // Polygon zeichnen
    const polygon = L.polygon([...polyPoints, polyPoints[0]], {
      color: 'red',
      weight: 3,
      opacity: 0.7,
      fillOpacity: 0.2
    }).addTo(map);

    // Hafen-Marker erstellen
    const harborIcon = L.icon({
      iconUrl: 'https://cdn-icons-png.flaticon.com/512/1436/1436507.png',
      iconSize: [24, 24],
      iconAnchor: [12, 12]
    });

    const harborMarkers = [];
    harbors.forEach((harbor, index) => {
      const marker = L.marker([harbor.lat, harbor.lng], {
        icon: harborIcon,
        title: `${harbor.name} (${harbor.ort}, ${harbor.land})`
      }).addTo(map);
      
      marker.bindPopup(`<b>${harbor.name}</b><br>${harbor.ort}, ${harbor.land}`);
      harborMarkers.push({ marker, ...harbor });
    });

    // Track-Linie für die Simulation
    let trackLine = L.polyline([], { color: 'blue', weight: 4, opacity: 0.8 }).addTo(map);
    let trackPoints = [];
    let boatMarker = null;
    let lastPosition = null;
    let lastTime = 0;
    let isTracking = false;
    let isAnker = false;

    // Boot-Marker (Segelboot-Icon)
    const boatIcon = L.icon({
      iconUrl: 'https://cdn-icons-png.flaticon.com/512/4096/4096634.png',
      iconSize: [32, 32],
      iconAnchor: [16, 16]
    });

    // Stillstand-Zähler (für Hafen-Erkennung)
    let stillstandCounter = 0;
    let lastStillstandPosition = null;
    const STILLSTAND_THRESHOLD = 3; // 3x gleiche Position = Stillstand
    const HARBOR_RADIUS = 200; // 200m Radius für Hafen-Erkennung

    // ============================================
    // RAY-CASTING ALGORITHMUS
    // ============================================
    function isInsidePolygon(lat, lng) {
      let intersections = 0;
      
      for (let i = 0, j = polyPoints.length - 1; i < polyPoints.length; j = i++) {
        const xi = polyPoints[i][1], yi = polyPoints[i][0];
        const xj = polyPoints[j][1], yj = polyPoints[j][0];
        
        const crossesHorizontal = (yi > lat) !== (yj > lat);
        const xIntersect = xi + (lat - yi) * (xj - xi) / (yj - yi);
        
        if (crossesHorizontal && lng < xIntersect) {
          intersections++;
        }
      }
      
      return intersections % 2 === 1;
    }

    // ============================================
    // HILFSFUNKTIONEN
    // ============================================
    function getDistance(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng / 2) * Math.sin(dLng / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    // Finde den nächsten Hafen und dessen Abstand
    function findNearestHarbor(lat, lng) {
      let nearestHarbor = null;
      let minDistance = Infinity;
      
      for (const harbor of harbors) {
        const distance = getDistance(lat, lng, harbor.lat, harbor.lng);
        if (distance < minDistance) {
          minDistance = distance;
          nearestHarbor = harbor;
        }
      }
      
      return { harbor: nearestHarbor, distance: minDistance };
    }

    // Prüfe ob sich das Boot bewegt
    function isMoving(currentLat, currentLng) {
      if (!lastPosition) return false;
      
      const distance = getDistance(
        lastPosition.lat, lastPosition.lng,
        currentLat, currentLng
      );
      
      const currentTime = Date.now();
      const timeDiff = currentTime - lastTime;
      
      // Bewegung: > 5m in den letzten 100ms
      const speed = distance / (timeDiff / 1000);
      return speed > 0.1;
    }

    // Prüfe ob Position gleich ist (für Stillstandserkennung)
    function isSamePosition(lat1, lng1, lat2, lng2, tolerance = 0.0001) {
      return Math.abs(lat1 - lat2) < tolerance && Math.abs(lng1 - lng2) < tolerance;
    }

    // Funktion: Status aktualisieren
    function updateStatus(lat, lng) {
      const inside = isInsidePolygon(lat, lng);
      const moving = isMoving(lat, lng);
      const { harbor, distance } = findNearestHarbor(lat, lng);
      
      // Debug-Anzeige
      document.getElementById('intersections').textContent = Array.from({length: polyPoints.length}, (_, i) => {
        const xi = polyPoints[i][1], yi = polyPoints[i][0];
        const xj = polyPoints[(i + 1) % polyPoints.length][1], yj = polyPoints[(i + 1) % polyPoints.length][0];
        const crossesHorizontal = (yi > lat) !== (yj > lat);
        const xIntersect = xi + (lat - yi) * (xj - xi) / (yj - yi);
        return crossesHorizontal && lng < xIntersect ? '1' : '0';
      }).join('') + ` (${Array.from({length: polyPoints.length}, (_, i) => {
        const xi = polyPoints[i][1], yi = polyPoints[i][0];
        const xj = polyPoints[(i + 1) % polyPoints.length][1], yj = polyPoints[(i + 1) % polyPoints.length][0];
        const crossesHorizontal = (yi > lat) !== (yj > lat);
        const xIntersect = xi + (lat - yi) * (xj - xi) / (yj - yi);
        return crossesHorizontal && lng < xIntersect ? 1 : 0;
      }).reduce((a, b) => a + b, 0)})`;
      
      document.getElementById('polygon-check').textContent = inside ? 'DRINNEN' : 'DRAUSSEN';
      document.getElementById('nearest-harbor').textContent = harbor ? harbor.name : 'Keiner';
      document.getElementById('harbor-distance').textContent = distance ? distance.toFixed(0) : '-';
      document.getElementById('stillstand-counter').textContent = stillstandCounter;
      
      let statusText = '';
      let statusClass = '';
      
      if (!inside) {
        statusText = '⚠️ AUSSERHALB Bodensee-Polygon (kein Track möglich)';
        statusClass = 'outside';
        isTracking = false;
        isAnker = false;
        stillstandCounter = 0;
        lastStillstandPosition = null;
      } else {
        if (distance <= HARBOR_RADIUS && !moving) {
          // Im Hafen: Abstand ≤200m UND Stillstand
          if (stillstandCounter >= STILLSTAND_THRESHOLD) {
            statusText = `⚓ Im Hafen ${harbor.name}`;
            statusClass = 'harbor';
            isAnker = true;
          } else {
            statusText = `🟡 Nähe Hafen ${harbor.name} (${distance.toFixed(0)}m) - Stillstand ${stillstandCounter}/${STILLSTAND_THRESHOLD}`;
            statusClass = 'tracking';
            isAnker = false;
          }
        } else if (moving) {
          statusText = '🚤 TRACK AKTIV - In Bewegung';
          statusClass = 'tracking';
          isAnker = false;
          stillstandCounter = 0;
          lastStillstandPosition = null;
        } else {
          statusText = '🟢 IM Polygon - Track bereit';
          statusClass = 'inside';
          isAnker = false;
          stillstandCounter = 0;
          lastStillstandPosition = null;
        }
      }
      
      document.getElementById('status').className = statusClass;
      document.getElementById('status-text').textContent = statusText;
    }

    // Mausbewegungs-Handler
    map.on('mousemove', function(e) {
      const lat = e.latlng.lat;
      const lng = e.latlng.lng;
      
      // Koordinaten anzeigen
      document.getElementById('lat').textContent = lat.toFixed(6);
      document.getElementById('lng').textContent = lng.toFixed(6);
      
      // Boot-Marker aktualisieren
      if (!boatMarker) {
        boatMarker = L.marker([lat, lng], { icon: boatIcon, zIndexOffset: 1000 }).addTo(map);
      } else {
        boatMarker.setLatLng([lat, lng]);
      }
      
      // Track-Linie aktualisieren
      const currentTime = Date.now();
      
      // Nur alle 500ms einen Punkt hinzufügen
      if (currentTime - lastTime > 500 || !lastTime) {
        trackPoints.push([lat, lng]);
        trackLine.setLatLngs(trackPoints);
        lastPosition = { lat, lng };
        lastTime = currentTime;
        
        // Stillstandserkennung
        if (!isMoving(lat, lng) && lastStillstandPosition) {
          if (isSamePosition(lat, lng, lastStillstandPosition.lat, lastStillstandPosition.lng)) {
            stillstandCounter++;
          } else {
            stillstandCounter = 1;
            lastStillstandPosition = { lat, lng };
          }
        } else {
          stillstandCounter = 0;
          lastStillstandPosition = { lat, lng };
        }
        
        // Status prüfen
        updateStatus(lat, lng);
        
        // Track-Logik: Nur wenn im Polygon
        if (isInsidePolygon(lat, lng)) {
          if (!isTracking) isTracking = true;
        } else {
          isTracking = false;
          trackPoints = [];
          trackLine.setLatLngs([]);
        }
      }
    });

    // Karte auf Polygon zoomen
    map.fitBounds(polygon.getBounds());

    // Track zurücksetzen bei Klick
    map.on('click', function(e) {
      trackPoints = [];
      trackLine.setLatLngs([]);
      isTracking = false;
      isAnker = false;
      stillstandCounter = 0;
      lastStillstandPosition = null;
      updateStatus(e.latlng.lat, e.latlng.lng);
    });
  </script>
</body>
</html>
