<!DOCTYPE html>
<html>
<head>
  <title>Bodensee-Polygon (GPS mit FIFO + echtem GPS)</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #map { height: 600px; width: 100%; }
    body { margin: 0; padding: 0; }
    #info {
      position: absolute;
      top: 10px;
      right: 10px;
      background: white;
      padding: 10px;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      font-family: Arial, sans-serif;
      z-index: 1000;
    }
    #status {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: white;
      padding: 10px;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      font-family: Arial, sans-serif;
      z-index: 1000;
      min-width: 300px;
    }
    .inside { background: #d4edda; }
    .outside { background: #f8d7da; }
    .tracking { background: #fff3cd; }
    .harbor { background: #d1ecf1; color: #0c5460; }
    #debug {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(255,255,255,0.8);
      padding: 8px;
      border-radius: 5px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      z-index: 1000;
      max-width: 350px;
    }
    #gps-info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: white;
      padding: 8px;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      font-family: Arial, sans-serif;
      font-size: 12px;
      z-index: 1000;
    }
    #permission-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      z-index: 2000;
      text-align: center;
    }
    #permission-banner button {
      margin-top: 10px;
      padding: 8px 16px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="gps-info">
    <strong>GPS Quelle:</strong> <span id="gps-source">Erkennung läuft...</span><br>
    <small id="os-info"></small>
  </div>
  <div id="info">
    <strong>Position</strong><br>
    Lat: <span id="lat">-</span><br>
    Lng: <span id="lng">-</span><br>
    <small>Bewege Maus oder aktiviere GPS</small>
  </div>
  <div id="status">
    <strong>Status:</strong> <span id="status-text">Warte auf Position...</span>
  </div>
  <div id="debug">
    <strong>Debug:</strong><br>
    Polygon: <span id="polygon-check">-</span><br>
    FIFO: <span id="fifo-state">[]</span><br>
    Nächster Hafen: <span id="nearest-harbor">-</span><br>
    Abstand: <span id="harbor-distance">-</span>m<br>
    Stillstand: <span id="stillstand-counter">0</span>/<span id="stillstand-threshold">3</span>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ============================================
    // KONFIGURATION
    // ============================================
    const CONFIG = {
      FIFO_SIZE: 3,           // Anzahl Punkte im FIFO für Stillstandserkennung
      HARBOR_RADIUS_DISPLAY: 500,  // 500m Radius für Hafen-Anzeige
      HARBOR_RADIUS_DETECT: 100,   // 100m Radius für Hafen-Erkennung (Stillstand)
      TRACK_INTERVAL: 500,    // 500ms zwischen Track-Punkten
      MOVEMENT_THRESHOLD: 0.1 // 0.1 m/s = ~0.36 km/h
    };

    // ============================================
    // BETRIEBSSYSTEM-ERKENNUNG
    // ============================================
    function detectOS() {
      const userAgent = window.navigator.userAgent || window.navigator.vendor || window.opera;
      
      if (/windows/i.test(userAgent)) {
        return 'Windows';
      } else if (/android/i.test(userAgent)) {
        return 'Android';
      } else if (/iPad|iPhone|iPod/i.test(userAgent)) {
        return 'iOS';
      } else if (/Mac/i.test(userAgent)) {
        return 'Mac';
      } else if (/Linux/i.test(userAgent)) {
        return 'Linux';
      }
      return 'Unknown';
    }

    const OS = detectOS();
    const IS_MOBILE = /Android|iOS/i.test(OS);
    const USES_REAL_GPS = IS_MOBILE;

    // ============================================
    // GPS-QUELLE
    // ============================================
    let currentPosition = null;
    let watchId = null;
    let gpsActive = false;

    function initGPS() {
      document.getElementById('os-info').textContent = `Betriebssystem: ${OS}`;
      
      if (!USES_REAL_GPS) {
        // Maus-Simulation für Desktop
        document.getElementById('gps-source').textContent = 'Maus (Desktop)';
        return;
      }

      // Echte GPS für Mobile
      document.getElementById('gps-source').textContent = 'GPS (Mobile)';

      if (navigator.geolocation) {
        // Hohe Genauigkeit anfordern
        const options = {
          enableHighAccuracy: true,
          timeout: 5000,
          maximumAge: 0
        };

        // Einmalige Position abfragen
        navigator.geolocation.getCurrentPosition(
          (position) => {
            currentPosition = {
              lat: position.coords.latitude,
              lng: position.coords.longitude
            };
            gpsActive = true;
            document.getElementById('gps-source').textContent = 'GPS (Mobile) - Aktiv';
            updatePosition(position.coords.latitude, position.coords.longitude);
          },
          (error) => {
            console.error('GPS-Fehler:', error);
            document.getElementById('gps-source').textContent = 'GPS - Berechtigung verweigert';
            showPermissionBanner();
          },
          options
        );

        // Kontinuierliche Updates
        watchId = navigator.geolocation.watchPosition(
          (position) => {
            currentPosition = {
              lat: position.coords.latitude,
              lng: position.coords.longitude
            };
            gpsActive = true;
            updatePosition(position.coords.latitude, position.coords.longitude);
          },
          (error) => {
            console.error('GPS-Watch-Fehler:', error);
          },
          options
        );
      } else {
        document.getElementById('gps-source').textContent = 'GPS nicht verfügbar';
      }
    }

    function showPermissionBanner() {
      const banner = document.createElement('div');
      banner.id = 'permission-banner';
      banner.innerHTML = `
        <h3>GPS-Berechtigung erforderlich</h3>
        <p>Bitte erlaube den Zugriff auf deine Position, um die GPS-Simulation zu nutzen.</p>
        <button onclick="requestGPSPermission()">Berechtigung erteilen</button>
      `;
      document.body.appendChild(banner);
    }

    function requestGPSPermission() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const banner = document.getElementById('permission-banner');
            if (banner) banner.remove();
            currentPosition = {
              lat: position.coords.latitude,
              lng: position.coords.longitude
            };
            gpsActive = true;
            document.getElementById('gps-source').textContent = 'GPS (Mobile) - Aktiv';
            updatePosition(position.coords.latitude, position.coords.longitude);
          },
          (error) => {
            console.error('GPS-Fehler:', error);
          }
        );
      }
    }

    // ============================================
    // HAFEN-DATEN (korrigierte Koordinaten)
    // ============================================
    const harbors = [
      // Deutschland - Nordufer

      {name: "Steckborn Hafen", ort: "Steckborn", land: "Deutschland", lat: 47.6750, lng: 8.9833},
      {name: "Büsingen Hafen", ort: "Büsingen", land: "Deutschland", lat: 47.7000, lng: 8.6000},
      
      // Schweiz - Nordufer
      {name: "Kreuzlingen Hafen", ort: "Kreuzlingen", land: "Schweiz", lat: 47.6460, lng: 9.1620},
      {name: "Neuhausen Rheinhafen", ort: "Neuhausen", land: "Schweiz", lat: 47.6250, lng: 8.8333},
      {name: "Ermatingen Hafen", ort: "Ermatingen", land: "Schweiz", lat: 47.6583, lng: 8.9500},

      {name: "Güttingen Hafen", ort: "Güttingen", land: "Schweiz", lat: 47.6000, lng: 9.1167},
      {name: "Sulgen Hafen", ort: "Sulgen", land: "Schweiz", lat: 47.6167, lng: 9.0500},
      {name: "Birwinken Hafen", ort: "Birwinken", land: "Schweiz", lat: 47.6000, lng: 9.0333},
      {name: "Bottighofen Hafen", ort: "Bottighofen", land: "Schweiz", lat: 47.6000, lng: 9.0167},
      {name: "Lippoldswilen Hafen", ort: "Lippoldswilen", land: "Schweiz", lat: 47.5833, lng: 9.0083},
      {name: "Egnach Hafen", ort: "Egnach", land: "Schweiz", lat: 47.5833, lng: 9.0000},
      {name: "Horn Hafen (CH)", ort: "Horn", land: "Schweiz", lat: 47.5667, lng: 8.9833},
      {name: "Arbon Hafen", ort: "Arbon", land: "Schweiz", lat: 47.5333, lng: 9.0000},
      {name: "Steinach Hafen", ort: "Steinach", land: "Schweiz", lat: 47.5167, lng: 9.0333},
      {name: "Rorschach Hafen", ort: "Rorschach", land: "Schweiz", lat: 47.4740, lng: 9.4820},
      {name: "Goldach Hafen", ort: "Goldach", land: "Schweiz", lat: 47.4667, lng: 9.4833},
      {name: "Staad Hafen", ort: "Staad", land: "Schweiz", lat: 47.4500, lng: 9.5000},
      {name: "Altenrhein Hafen", ort: "Altenrhein", land: "Schweiz", lat: 47.4833, lng: 9.5333},
      {name: "Thal Hafen", ort: "Thal", land: "Schweiz", lat: 47.4667, lng: 9.5500},
      {name: "Rheineck Hafen", ort: "Rheineck", land: "Schweiz", lat: 47.4500, lng: 9.5667},
      {name: "St. Gallen Hafen", ort: "St. Gallen", land: "Schweiz", lat: 47.4250, lng: 9.3833},
      {name: "Stein am Rhein Hafen", ort: "Stein am Rhein", land: "Schweiz", lat: 47.6167, lng: 8.8333},
      {name: "Schaffhausen Hafen", ort: "Schaffhausen", land: "Schweiz", lat: 47.7000, lng: 8.6333},
      {name: "Thayngen Hafen", ort: "Thayngen", land: "Schweiz", lat: 47.7000, lng: 8.6167},
      
      // Österreich
      {name: "Bregenz Hafen", ort: "Bregenz", land: "Österreich", lat: 47.5067, lng: 9.7467},
      {name: "Dornbirn Hafen", ort: "Dornbirn", land: "Österreich", lat: 47.4170, lng: 9.7458},
      {name: "Lochau Hafen", ort: "Lochau", land: "Österreich", lat: 47.5167, lng: 9.7583},
      {name: "Hard Hafen", ort: "Hard", land: "Österreich", lat: 47.4167, lng: 9.7500},
      {name: "Hörbranz Hafen", ort: "Hörbranz", land: "Österreich", lat: 47.6000, lng: 9.3667}
    ];

    // ============================================
    // KARTE INITIALISIEREN
    // ============================================
    const map = L.map('map').setView([47.6, 9.2], 8);

    // OpenStreetMap als Basiskarte
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    // OpenSeaMap als Overlay
    L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png', {
      attribution: 'Seamarks: &copy; <a href="https://www.openseamap.org">OpenSeaMap</a>'
    }).addTo(map);

    // Polygon-Punkte (deine 6 Eckpunkte)
    const polyPoints = [
      [47.627, 8.8278],   // Neuhausen TG (CH)
      [47.646, 9.162],    // Kreuzlingen TG (CH)
      [47.474, 9.482],    // Rorschach SG (CH)
      [47.417, 9.7458],   // Dornbirn (AT)
      [47.562, 9.8175],   // Möggers (AT)
      [47.850, 9.0167]    // Stockach (DE)
    ];

    // Polygon zeichnen
    const polygon = L.polygon([...polyPoints, polyPoints[0]], {
      color: 'red',
      weight: 3,
      opacity: 0.7,
      fillOpacity: 0.2
    }).addTo(map);

    // Hafen-Marker erstellen
    const harborIcon = L.icon({
      iconUrl: 'https://cdn-icons-png.flaticon.com/512/1436/1436507.png',
      iconSize: [24, 24],
      iconAnchor: [12, 12]
    });

    harbors.forEach((harbor) => {
      const marker = L.marker([harbor.lat, harbor.lng], {
        icon: harborIcon,
        title: `${harbor.name} (${harbor.ort}, ${harbor.land})`
      }).addTo(map);
      
      marker.bindPopup(`<b>${harbor.name}</b><br>${harbor.ort}, ${harbor.land}`);
    });

    // ============================================
    // TRACK-LINIE UND MARKER
    // ============================================
    let trackLine = L.polyline([], { color: 'blue', weight: 4, opacity: 0.8 }).addTo(map);
    let trackPoints = [];
    let boatMarker = null;
    
    // FIFO für Stillstandserkennung
    let positionFIFO = [];
    let lastPosition = null;
    let lastTime = 0;
    let isTracking = false;
    let isAnker = false;

    // Boot-Marker (Segelboot-Icon)
    const boatIcon = L.icon({
      iconUrl: 'https://cdn-icons-png.flaticon.com/512/4096/4096634.png',
      iconSize: [32, 32],
      iconAnchor: [16, 16]
    });

    // ============================================
    // RAY-CASTING ALGORITHMUS
    // ============================================
    function isInsidePolygon(lat, lng) {
      let intersections = 0;
      
      for (let i = 0, j = polyPoints.length - 1; i < polyPoints.length; j = i++) {
        const xi = polyPoints[i][1], yi = polyPoints[i][0];
        const xj = polyPoints[j][1], yj = polyPoints[j][0];
        
        const crossesHorizontal = (yi > lat) !== (yj > lat);
        const xIntersect = xi + (lat - yi) * (xj - xi) / (yj - yi);
        
        if (crossesHorizontal && lng < xIntersect) {
          intersections++;
        }
      }
      
      return intersections % 2 === 1;
    }

    // ============================================
    // HILFSFUNKTIONEN
    // ============================================
    function getDistance(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng / 2) * Math.sin(dLng / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    // Finde den nächsten Hafen und dessen Abstand
    function findNearestHarbor(lat, lng) {
      let nearestHarbor = null;
      let minDistance = Infinity;
      
      for (const harbor of harbors) {
        const distance = getDistance(lat, lng, harbor.lat, harbor.lng);
        if (distance < minDistance) {
          minDistance = distance;
          nearestHarbor = harbor;
        }
      }
      
      return { harbor: nearestHarbor, distance: minDistance };
    }

    // Prüfe ob Position gleich ist (für FIFO)
    function isSamePosition(pos1, pos2, tolerance = 0.00001) {
      return Math.abs(pos1.lat - pos2.lat) < tolerance && 
             Math.abs(pos1.lng - pos2.lng) < tolerance;
    }

    // ============================================
    // POSITION AKTUALISIEREN (von Maus oder GPS)
    // ============================================
    function updatePosition(lat, lng) {
      const currentTime = Date.now();
      
      // Koordinaten anzeigen
      document.getElementById('lat').textContent = lat.toFixed(6);
      document.getElementById('lng').textContent = lng.toFixed(6);
      
      // Boot-Marker aktualisieren
      if (!boatMarker) {
        boatMarker = L.marker([lat, lng], { icon: boatIcon, zIndexOffset: 1000 }).addTo(map);
      } else {
        boatMarker.setLatLng([lat, lng]);
      }
      
      // Immer Position im FIFO speichern (für Stillstandserkennung)
      const currentPos = { lat, lng, time: currentTime };
      
      // FIFO aktualisieren (maximal CONFIG.FIFO_SIZE Punkte)
      if (positionFIFO.length >= CONFIG.FIFO_SIZE) {
        positionFIFO.shift();
      }
      positionFIFO.push(currentPos);
      
      // Nur alle CONFIG.TRACK_INTERVAL ms einen Punkt zur Track-Linie hinzufügen
      if (currentTime - lastTime > CONFIG.TRACK_INTERVAL || !lastTime) {
        // Prüfe ob Stillstand (alle Positionen im FIFO gleich)
        const allSame = positionFIFO.length >= CONFIG.FIFO_SIZE &&
                        positionFIFO.every(p => isSamePosition(p, positionFIFO[0]));
        
        // Track-Punkt nur hinzufügen, wenn NICHT Stillstand
        if (!allSame) {
          trackPoints.push([lat, lng]);
          trackLine.setLatLngs(trackPoints);
        }
        
        lastPosition = { lat, lng };
        lastTime = currentTime;
        
        // Status prüfen
        updateStatus(lat, lng);
        
        // Track-Logik: Nur wenn im Polygon
        if (isInsidePolygon(lat, lng)) {
          if (!isTracking) isTracking = true;
        } else {
          isTracking = false;
          trackPoints = [];
          trackLine.setLatLngs([]);
          positionFIFO = [];
        }
      }
    }

    // ============================================
    // STATUS AKTUALISIEREN
    // ============================================
    function updateStatus(lat, lng) {
      const inside = isInsidePolygon(lat, lng);
      const { harbor, distance } = findNearestHarbor(lat, lng);
      
      // Debug-Anzeige
      document.getElementById('polygon-check').textContent = inside ? 'DRINNEN' : 'DRAUSSEN';
      document.getElementById('nearest-harbor').textContent = harbor ? harbor.name : 'Keiner';
      document.getElementById('harbor-distance').textContent = distance ? distance.toFixed(0) : '-';
      document.getElementById('stillstand-counter').textContent = positionFIFO.length;
      document.getElementById('stillstand-threshold').textContent = CONFIG.FIFO_SIZE;
      document.getElementById('fifo-state').textContent = 
        positionFIFO.map(p => `(${p.lat.toFixed(4)},${p.lng.toFixed(4)})`).join(' → ');
      
      let statusText = '';
      let statusClass = '';
      
      if (!inside) {
        statusText = '⚠️ AUSSERHALB Bodensee-Polygon (kein Track möglich)';
        statusClass = 'outside';
        isTracking = false;
        isAnker = false;
        positionFIFO = [];
      } else {
        const allSame = positionFIFO.length >= CONFIG.FIFO_SIZE &&
                        positionFIFO.every(p => isSamePosition(p, positionFIFO[0]));
        
        if (distance <= CONFIG.HARBOR_RADIUS_DETECT && allSame) {
          statusText = `⚓ Im Hafen ${harbor.name}`;
          statusClass = 'harbor';
          isAnker = true;
        } else if (distance <= CONFIG.HARBOR_RADIUS_DISPLAY) {
          statusText = `🟡 Nähe Hafen ${harbor.name} (${distance.toFixed(0)}m)`;
          statusClass = 'tracking';
          isAnker = false;
        } else if (allSame) {
          statusText = `🟢 IM Polygon - Stillstand (${positionFIFO.length}/${CONFIG.FIFO_SIZE})`;
          statusClass = 'inside';
          isAnker = false;
        } else {
          statusText = isTracking ? '🚤 TRACK AKTIV - In Bewegung' : '🟢 IM Polygon - Track bereit';
          statusClass = isTracking ? 'tracking' : 'inside';
          isAnker = false;
        }
      }
      
      document.getElementById('status').className = statusClass;
      document.getElementById('status-text').textContent = statusText;
    }

    // ============================================
    // MAUSBEWEGUNGS-HANDLER (für Desktop)
    // ============================================
    map.on('mousemove', function(e) {
      if (USES_REAL_GPS) return;
      updatePosition(e.latlng.lat, e.latlng.lng);
    });

    // ============================================
    // GPS-UPDATES (für Mobile)
    // ============================================
    function handleGPSUpdate(position) {
      if (!USES_REAL_GPS) return;
      updatePosition(position.coords.latitude, position.coords.longitude);
    }

    // ============================================
    // KARTE ZENTRIEREN
    // ============================================
    map.fitBounds(polygon.getBounds());

    // ============================================
    // TRACK ZURÜCKSETZEN
    // ============================================
    map.on('click', function(e) {
      trackPoints = [];
      trackLine.setLatLngs([]);
      isTracking = false;
      isAnker = false;
      positionFIFO = [];
      lastPosition = null;
      lastTime = 0;
      if (!USES_REAL_GPS) {
        updateStatus(e.latlng.lat, e.latlng.lng);
      }
    });

    // ============================================
    // INITIALISIERUNG
    // ============================================
    initGPS();
    
    if (USES_REAL_GPS && navigator.geolocation) {
      watchId = navigator.geolocation.watchPosition(
        handleGPSUpdate,
        (error) => { console.error('GPS-Fehler:', error); },
        { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
      );
    }
    
    if (!USES_REAL_GPS) {
      updateStatus(47.6, 9.2);
    }
  </script>
</body>
</html>
